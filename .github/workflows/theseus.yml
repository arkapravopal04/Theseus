name: theseus
on:
  pull_request:
    # Generated from theseus.formats.paths_filter() (tests/test_ci.py keeps them in sync).
    # Path filters are case-sensitive; the [sS] classes match PART.STEP and part.step alike.
    paths:
      - '**.[sS][tT][eE][pP]'
      - '**.[sS][tT][pP]'
      - '**.[pP]21'
      - '**.[iI][gG][eE][sS]'
      - '**.[iI][gG][sS]'
      - '**.[bB][rR][eE][pP]'
      - '**.[bB][rR][pP]'
      - '**.[sS][tT][lL]'
      - '**.3[mM][fF]'
      - '**.[gG][lL][bB]'
      - '**.[pP][lL][yY]'
      - '**.[oO][bB][jJ]'
      - '**.[oO][fF][fF]'
permissions:
  contents: write       # report images go on the theseus-assets branch
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./
