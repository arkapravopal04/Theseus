name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Tag must match theseus.__version__
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('theseus/__init__.py').read()).group(1))")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - name: Create GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      # `uses: arkapravopal04/theseus@v1` follows the latest v1.x.y release.
      - name: Move the floating major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$major"
