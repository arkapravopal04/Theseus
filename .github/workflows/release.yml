name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Tag must match theseus.__version__
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('theseus/__init__.py').read()).group(1))")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1 libegl1
      - run: pip install -r requirements-dev.txt build
      - run: python -m pytest tests/ -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
      # `uses: arkapravopal04/theseus@v1` follows the latest v1.x.y release.
      - name: Move the floating major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$major"

  pypi:
    # `pip install theseus-cad` / `pipx install theseus-cad`. Trusted publishing: PyPI accepts
    # this workflow's identity, so no API token is stored anywhere. One-time setup on pypi.org:
    # add a "pending publisher" for project theseus-cad, owner arkapravopal04, repository theseus,
    # workflow release.yml, environment pypi.
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
