[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus"
dynamic = ["version"]
description = "Diff and preview CAD files (STEP/IGES/BREP/STL/3MF/OBJ/PLY/GLB) without needing CAD software."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cadquery-ocp==8.0.1.0.0",
    "numpy",
    "trimesh",
    "matplotlib",
    "scipy",
    "networkx",
    "lxml",
    "rtree",
    "manifold3d",
    "vtk",
]

[project.urls]
Repository = "https://github.com/arkapravopal04/theseus"

[project.scripts]
theseus = "theseus.cli:main"

[tool.setuptools.dynamic]
version = { attr = "theseus.__version__" }

[tool.setuptools.packages.find]
include = ["theseus*"]
