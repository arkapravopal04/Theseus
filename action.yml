name: 'theseus'
description: 'Precise CAD diffs on PRs: which face, hole or region changed and by how much, down to the micron'
branding:
  icon: 'box'
  color: 'blue'
inputs:
  timeout-seconds:
    description: 'Seconds allowed to load one version of one file before it is skipped'
    default: '300'
  max-file-mb:
    description: 'Skip files larger than this many megabytes'
    default: '50'
  images:
    description: 'inline (default): before/after/difference images in the comment, hosted on a theseus-assets branch (needs `contents: write`). artifact: images only as a workflow artifact. off: text only.'
    default: 'inline'
  sensitivity:
    description: 'How big a difference must be to be called a change rather than a micro-change: engineering (10 µm / 0.1%), fine (1 µm / 0.01%) or exact (anything above the detection limit). Differences above the detection limit are always listed.'
    default: 'engineering'
  units:
    description: 'Length unit of formats that do not record one (STL, OBJ, PLY, OFF, BREP): mm, cm, m, in, ft, um. Default: mm'
    default: ''
  python-version:
    description: 'Python version to run theseus with (3.11 or newer)'
    default: '3.11'
runs:
  using: 'composite'
  steps:
    # No `cache: pip` here: setup-python looks for a requirements file in the *caller's* repo
    # and fails the job when there isn't one, which is most repos that just hold CAD files.
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: ${{ inputs.python-version }}
    # The dependencies are ~1.4 GB (OpenCascade, VTK). Installing them takes minutes, so the
    # whole virtualenv is cached, keyed on everything that would change its contents.
    - id: venv
      shell: bash
      run: |
        python - <<'PY'
        import hashlib, os, sys
        if sys.version_info < (3, 11):
            sys.exit(f"::error title=theseus::theseus needs Python 3.11 or newer (python-version is {sys.version.split()[0]})")
        digest = hashlib.sha256(open(os.path.join(os.environ["GITHUB_ACTION_PATH"], "requirements.txt"), "rb").read())
        venv = os.path.join(os.environ["RUNNER_TEMP"], "theseus-venv")
        python = os.path.join(venv, "Scripts", "python.exe") if os.name == "nt" else os.path.join(venv, "bin", "python")
        key = "-".join(["theseus-venv", os.environ["RUNNER_OS"], os.environ["RUNNER_ARCH"],
                        sys.version.split()[0], digest.hexdigest()[:16]])
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write(f"dir={venv}\npython={python}\nkey={key}\n")
        PY
    - uses: actions/cache@v4
      id: cache
      with:
        path: ${{ steps.venv.outputs.dir }}
        key: ${{ steps.venv.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv "${{ steps.venv.outputs.dir }}"
        "${{ steps.venv.outputs.python }}" -m pip install --disable-pip-version-check -q -r "${{ github.action_path }}/requirements.txt"
    - run: '"${{ steps.venv.outputs.python }}" "${{ github.action_path }}/bot.py"'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.event.after }}
        THESEUS_TIMEOUT: ${{ inputs.timeout-seconds }}
        THESEUS_MAX_FILE_MB: ${{ inputs.max-file-mb }}
        THESEUS_UNITS: ${{ inputs.units }}
        THESEUS_SENSITIVITY: ${{ inputs.sensitivity }}
        THESEUS_IMAGES: ${{ inputs.images }}
        THESEUS_IMAGE_DIR: ${{ runner.temp }}/theseus-images
    # Always attached: the fallback when images can't go inline (fork PRs, read-only tokens),
    # and where the full-size views and 3D viewer live.
    - uses: actions/upload-artifact@v4
      if: always() && inputs.images != 'off'
      with:
        name: theseus-images
        path: ${{ runner.temp }}/theseus-images
        if-no-files-found: ignore
